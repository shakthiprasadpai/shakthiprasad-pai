<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minervini SEPA Second Brain Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background: #0f1218;
      color: #f1f5f9;
      padding: 14px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2430;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 14px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand-sub {
      font-size: 9px;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .badge-status {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 700;
    }
    .field-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      background: #181d27;
      border: 1px solid #283244;
      color: #f8fafc;
      padding: 7px 9px;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #f59e0b;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .para-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }
    .para-btn {
      background: #181d27;
      border: 1px solid #283244;
      color: #94a3b8;
      padding: 5px 2px;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .para-btn:hover {
      border-color: #f59e0b;
      color: #fff;
    }
    .para-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
      font-weight: 800;
    }
    textarea {
      resize: vertical;
      min-height: 65px;
      font-family: inherit;
    }
    .action-btn {
      width: 100%;
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .action-btn:hover {
      background: #fbbf24;
    }
    .secondary-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .sub-btn {
      flex: 1;
      background: #181d27;
      border: 1px solid #283244;
      color: #cbd5e1;
      padding: 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
    }
    .sub-btn:hover {
      background: #232a39;
      color: #fff;
    }
    .alert-box {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .detected-source {
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .detected-source span {
      color: #f59e0b;
      font-weight: bold;
    }
    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e2430;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #64748b;
    }
    .footer a {
      color: #f59e0b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🧠</div>
      <div>
        <div class="brand-title">SECOND BRAIN</div>
        <div class="brand-sub">Minervini SEPA Web Clipper</div>
      </div>
    </div>
    <div id="connectionStatus" class="badge-status">READY</div>
  </div>

  <div class="detected-source">
    <div>Source: <span id="sourceLabel">Web Article</span></div>
    <div id="urlHostLabel" style="font-size: 9px; color: #64748b;"></div>
  </div>

  <div class="row" style="margin-top: 8px;">
    <div class="field-group" style="flex: 1;">
      <label for="tickerInput">Ticker Symbol</label>
      <input type="text" id="tickerInput" placeholder="e.g. NVDA, TRENT" style="text-transform: uppercase; font-weight: bold; color: #f59e0b;">
    </div>
    <div class="field-group" style="flex: 1.5;">
      <label for="setupSelect">Setup / Pattern</label>
      <select id="setupSelect">
        <option value="VCP Breakout">VCP Breakout</option>
        <option value="Pocket Pivot">Pocket Pivot</option>
        <option value="High Tight Flag">High Tight Flag</option>
        <option value="Cup with Handle">Cup with Handle</option>
        <option value="21 EMA Bounce">21 EMA Bounce</option>
        <option value="Stage 2 Confirmation">Stage 2 Confirmation</option>
        <option value="Earnings Catalyst">Earnings Catalyst</option>
        <option value="General Trade Idea">General Trade Idea</option>
      </select>
    </div>
  </div>

  <div class="field-group">
    <label for="titleInput">Note Title</label>
    <input type="text" id="titleInput" placeholder="Thesis / Headline / Key Takeaway">
  </div>

  <label>P.A.R.A Category</label>
  <div class="para-grid">
    <div class="para-btn active" data-para="PROJECTS">🎯 Projects</div>
    <div class="para-btn" data-para="AREAS">🛡️ Areas</div>
    <div class="para-btn" data-para="RESOURCES">📚 Resources</div>
    <div class="para-btn" data-para="ARCHIVES">📦 Archives</div>
  </div>

  <div class="field-group">
    <label for="contentInput">Clipped Content / Selected Text</label>
    <textarea id="contentInput" placeholder="Paste chart notes, selected tweet, or article insights here..."></textarea>
  </div>

  <button id="clipBtn" class="action-btn">
    <span>🧠 Clip to Minervini Second Brain</span>
  </button>

  <div class="secondary-actions">
    <button id="copyMdBtn" class="sub-btn">📋 Copy Obsidian MD</button>
    <button id="openAppBtn" class="sub-btn">🚀 Open Screener</button>
  </div>

  <div id="alertBox" class="alert-box"></div>

  <div class="footer">
    <span>Minervini SEPA Growth Screener</span>
    <a href="#" id="openOptionsLink">Configure Host</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
